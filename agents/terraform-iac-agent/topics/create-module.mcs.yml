mcs.metadata:
  componentName: Collect Module
kind: AdaptiveDialog
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: CollectModule
    triggerQueries:
      - create module
      - new module
      - build a module
      - add to alz-modules
      - reusable module
      - create a terraform module
      - create a new reusable module
      - I want a new module
      - add a module to alz-modules
  actions:
    - kind: SendActivity
      id: start001
      activity: Great! I will help you create a new reusable Terraform module on the alz-modules branch.

    - kind: Question
      id: question_moduleName
      alwaysPrompt: false
      variable: init:Topic.ModuleName
      prompt: What should the module be named? Use lowercase with hyphens (e.g. keyvault-module, networking-module, mysql-module).
      entity: StringPrebuiltEntity

    - kind: Question
      id: question_resourceTypes
      alwaysPrompt: false
      variable: init:Topic.ResourceTypes
      prompt: Which Azure resource(s) should this module manage? (e.g. Key Vault, MySQL Flexible Server, Virtual Network + NSG, Container App)
      entity: StringPrebuiltEntity

    - kind: Question
      id: question_optionalFeatures
      alwaysPrompt: false
      variable: init:Topic.OptionalFeatures
      prompt: Any optional features to include? (e.g. private endpoints, diagnostic settings, lifecycle policies, soft delete, resource locks). Type none to skip.
      entity: StringPrebuiltEntity

    - kind: SetTextVariable
      id: setGlobal_moduleName
      variable: Global.ModuleName
      value: "{Topic.ModuleName}"

    - kind: SetTextVariable
      id: setGlobal_resourceTypes
      variable: Global.ResourceTypes
      value: "{Topic.ResourceTypes}"

    - kind: SetTextVariable
      id: setGlobal_optionalFeatures
      variable: Global.OptionalFeatures
      value: "{Topic.OptionalFeatures}"

    - kind: SendActivity
      id: sendMessage_generating
      activity: |
        ⚙️ Generating your **{Global.ModuleName}** Terraform module...

        Target folder: `{Global.ModuleName}/` on the `alz-modules` branch.
        I will generate all required files and push them to GitHub. This may take a moment.

    - kind: BeginDialog
      id: redirectToGenerator
      dialog: generate-push-module
