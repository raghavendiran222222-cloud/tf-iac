mcs.metadata:
  componentName: Generate Push Module
kind: AdaptiveDialog
beginDialog:
  kind: OnSystemRedirect
  id: main
  actions:
    - kind: SendActivity
      id: start001
      activity: |
        ⚙️ Generating your **{Global.ModuleName}** Terraform module...

        Target folder: `{Global.ModuleName}/` on the `alz-modules` branch.
        I will generate all 8 files and push them one by one. This may take a moment.

    - kind: SetTextVariable
      id: buildPrompt
      variable: init:Topic.GenerationPrompt
      value: |
        You are an Azure Terraform IaC code generator. Generate a complete, production-ready
        Terraform module and push it to GitHub following the exact steps below.

        MODULE: {Global.ModuleName}
        RESOURCES: {Global.ResourceTypes}
        OPTIONAL FEATURES: {Global.OptionalFeatures}
        TARGET REPO: alz-modules (owner: bdtmsd)
        TARGET FOLDER: {Global.ModuleName}/
        FEATURE BRANCH: feat/{Global.ModuleName}-agent

        GENERATION RULES
        - Use Azure Verified Modules (AVM) with exact version pins: Azure/avm-res-keyvault-vault ~> 0.9, Azure/avm-res-storage-storageaccount ~> 0.4, Azure/avm-res-network-virtualnetwork ~> 0.8
        - Apply BDT tagging schema on every resource: Application, DevOwner, BusinessOwner, Environment, DataClassification, BusinessCriticality, IACRepository, ManagedBy=Terraform, CreationDate
        - Naming convention: PREFIX-bdt-APP-ENV-REGION-001 (e.g. kv-bdt-myapp-dev-eus2-001)
        - Providers: azurerm >= 4.70.0, Terraform >= 1.9, less than 2.0
        - All HCL uses 2-space indentation (never tabs), = signs aligned within each block
        - Security: Key Vault must have purge_protection_enabled=true, public_network_access_enabled=false; Storage must have public_network_access_enabled=false, min_tls_version=TLS1_2; App Service must have https_only=true
        - Never hardcode secrets — use variables with sensitive=true
        - Generate each file completely — no placeholders, no TODO comments
        - locals.tf must include region_abbreviation map and merged_tags local

        GITHUB WORKFLOW — follow this exact order
        STEP 1 — Create branch feat/{Global.ModuleName}-agent off alz-modules HEAD
        Announce: "Created branch feat/{Global.ModuleName}-agent"

        STEP 2 — Push 8 files using create_or_update_file one at a time (NEVER use push_files)
        Common params: owner=bdtmsd, repo=alz-modules, branch=feat/{Global.ModuleName}-agent

        File 1 of 8 — path: {Global.ModuleName}/versions.tf
                  message: "feat: add versions.tf for {Global.ModuleName}"
                  Announce: "Pushed versions.tf (1 of 8)"

        File 2 of 8 — path: {Global.ModuleName}/variables.tf
                  message: "feat: add variables.tf for {Global.ModuleName}"
                  Announce: "Pushed variables.tf (2 of 8)"

        File 3 of 8 — path: {Global.ModuleName}/locals.tf
                  message: "feat: add locals.tf for {Global.ModuleName}"
                  Announce: "Pushed locals.tf (3 of 8)"

        File 4 of 8 — path: {Global.ModuleName}/main.tf
                  message: "feat: add main.tf for {Global.ModuleName}"
                  Announce: "Pushed main.tf (4 of 8)"

        File 5 of 8 — path: {Global.ModuleName}/outputs.tf
                  message: "feat: add outputs.tf for {Global.ModuleName}"
                  Announce: "Pushed outputs.tf (5 of 8)"

        File 6 of 8 — path: {Global.ModuleName}/CHANGELOG.md
                  message: "feat: add CHANGELOG.md for {Global.ModuleName}"
                  Announce: "Pushed CHANGELOG.md (6 of 8)"

        File 7 of 8 — path: {Global.ModuleName}/README.md
                  message: "feat: add README.md for {Global.ModuleName}"
                  Announce: "Pushed README.md (7 of 8)"

        File 8 of 8 — path: {Global.ModuleName}/examples/basic/main.tf
                  message: "feat: add examples/basic/main.tf for {Global.ModuleName}"
                  Announce: "Pushed examples/basic/main.tf (8 of 8)"

        STEP 3 — Create Pull Request
        Tool: create_pull_request
        owner: bdtmsd, repo: alz-modules
        head: feat/{Global.ModuleName}-agent
        base: alz-modules
        title: feat: add {Global.ModuleName} module (agent)
        body includes:
          Summary: Module={Global.ModuleName}, Resources={Global.ResourceTypes}, Features={Global.OptionalFeatures}
          Files Added: all 8 files listed above
          Checklist: terraform validate, tflint, checkov -d ., Tags validated FDD Table 12
        Announce: "Pull Request created"

    - kind: AnswerQuestionWithAI
      id: generate001
      variable: init:Topic.GenerationResult
      userInput: =Topic.GenerationPrompt

    - kind: SendActivity
      id: result001
      activity: "{Topic.GenerationResult}"

    - kind: SendActivity
      id: done001
      activity: |
        Done! Your **{Global.ModuleName}** module has been scaffolded and pushed to GitHub.

        Say **"create another module"** to build another, or ask me to explain any generated file.

    - kind: EndDialog
      id: end001
