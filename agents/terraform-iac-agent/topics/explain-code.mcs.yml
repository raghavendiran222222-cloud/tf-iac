mcs.metadata:
  componentName: Explain Code
kind: AdaptiveDialog
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: ExplainCode
    triggerQueries:
      - explain
      - what does
      - how does
      - walk me through
      - teach me
      - help me understand
      - what is
      - explain the code
      - explain this file
      - how does the backend work
      - what does locals.tf do
      - explain the naming convention
      - how does the module work
      - learning
      - I want to learn
      - explain terraform
      - what is this terraform doing
  actions:
    - kind: SendActivity
      id: start001
      activity: Happy to explain! Tell me what you want to understand and I will walk you through it in plain English.

    - kind: Question
      id: question_TargetFile
      alwaysPrompt: false
      variable: init:Topic.TargetFile
      prompt: "Which file, concept, or pattern would you like explained? Examples: storage-module/locals.tf, mvp-app/backend.tf, the naming convention, the tag governance rules, or how HCP Terraform backend works."
      entity: StringPrebuiltEntity

    - kind: SetTextVariable
      id: buildPrompt
      variable: init:Topic.ExplainPrompt
      value: |
        You are an Azure Terraform IaC expert explaining code to a developer who wants to learn.

        The user wants to understand: {Topic.TargetFile}

        Using the Terraform ALZ knowledge base, explain this concept or file in plain English.
        Cover:
        1. WHAT it does — the functional purpose
        2. WHY it is structured that way — the design intent, ALZ governance constraint, or Azure requirement
        3. HOW it connects to the bigger picture — how it fits the Azure Landing Zone pattern

        Key conventions to reference where relevant:
        - Naming: {{resource-type}}-bdt-{{app}}-{{env}}-{{region-abbr}}-001
        - Tags: Application, DevOwner, BusinessOwner, Environment, DataClassification, BusinessCriticality, IACRepository
        - Backend: HCP Terraform Cloud, org bdtmsd
        - Providers: azurerm ~> 4.71, azapi ~> 2.9
        - Repo: alz-landingzones-infra (apps), alz-modules (modules)

        Be specific about Azure concepts. Answer the question directly first, then offer to expand.
        No branch or PR needed — respond inline only.

    - kind: AnswerQuestionWithAI
      id: generate001
      variable: init:Topic.Explanation
      userInput: =Topic.ExplainPrompt

    - kind: SendActivity
      id: result001
      activity: "{Topic.Explanation}"

    - kind: Question
      id: question_FollowUp
      alwaysPrompt: false
      variable: init:Topic.FollowUp
      prompt: Would you like me to explain a related concept, go deeper into a specific block, or create/modify code? Type your question or done to finish.
      entity: StringPrebuiltEntity

    - kind: ConditionGroup
      id: conditionGroup-followUp
      conditions:
        - id: conditionGroup-followUp-item-0
          condition: =Or(Or(Topic.FollowUp = "done", Topic.FollowUp = "no"), Topic.FollowUp = "nothing")
          actions:
            - kind: SendActivity
              id: sendMessage_Done
              activity: Great! Feel free to come back anytime to create modules, scaffold apps, or dive deeper into the code.
        - id: conditionGroup-followUp-item-1
          condition: =true
          actions:
            - kind: SetTextVariable
              id: setVar_updateQuery
              variable: Topic.TargetFile
              value: "{Topic.FollowUp}"
            - kind: GotoAction
              id: gotoAction_reExplain
              actionId: buildPrompt

    - kind: EndDialog
      id: end001
