# Create App — scaffolds a full Terraform application stack on alz-landingzones-infra
kind: AdaptiveDialog
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    triggerQueries:
      - create app
      - new application
      - new service
      - new landing zone
      - create infrastructure for
      - scaffold application
      - create a new terraform application
      - I need a new app
      - build application infrastructure
      - create non-prod environment
      - create prod environment
      - add a new workload
  actions:
    - kind: SendActivity
      id: sendMessage_createAppStart
      activity: Let us scaffold a complete Terraform application stack on the alz-landingzones-infra branch.

    - kind: Question
      id: question_appName
      alwaysPrompt: false
      variable: init:Topic.AppName
      prompt: What is the application name? Use lowercase with hyphens (e.g. payments-api, reporting-app, auth-service).
      entity: StringPrebuiltEntity

    - kind: Question
      id: question_environment
      alwaysPrompt: false
      variable: init:Topic.Environment
      prompt: Which environment? Use sandbox, dev, test, stage, qa, uat, sit, or nonprod for non-prod — or prod, mgt, con, id for production.
      entity: StringPrebuiltEntity

    - kind: Question
      id: question_resources
      alwaysPrompt: false
      variable: init:Topic.Resources
      prompt: Which Azure resources are needed? (e.g. VNet, App Service Plan + App Service, MySQL Flexible Server, Storage Account, Container Apps, Key Vault, Log Analytics)
      entity: StringPrebuiltEntity

    - kind: Question
      id: question_specialConfig
      alwaysPrompt: false
      variable: init:Topic.SpecialConfig
      prompt: Any special configuration such as VNet CIDR range, App Service SKU, MySQL SKU, or enable resource locks? Type defaults to use standard values.
      entity: StringPrebuiltEntity

    # Determine tier from environment value
    - kind: ConditionGroup
      id: conditionGroup-determineTier
      conditions:
        - id: conditionGroup-determineTier-item-0
          condition: =Or(Or(Or(Or(Or(Or(Or(Topic.Environment = "sandbox", Topic.Environment = "dev"), Topic.Environment = "test"), Topic.Environment = "stage"), Topic.Environment = "qa"), Topic.Environment = "uat"), Topic.Environment = "sit"), Topic.Environment = "nonprod")
          actions:
            - kind: SetVariable
              id: setVar_tierNonProd
              variable: Topic.Tier
              value: non-prod
        - id: conditionGroup-determineTier-item-1
          condition: =true
          actions:
            - kind: SetVariable
              id: setVar_tierProd
              variable: Topic.Tier
              value: prod

    - kind: SendActivity
      id: sendMessage_generating
      activity: Generating {Topic.Tier} stack for **{Topic.AppName}** ({Topic.Environment} environment). Folder will be {Topic.Tier}/{Topic.AppName}/ with all 10 required files.

    - kind: SetVariable
      id: setVar_featureBranch
      variable: Topic.FeatureBranch
      value: '=Concatenate(Topic.AppName, "-", Topic.Environment, "-agent")'

    - kind: InvokeFlowAction
      id: invokeFlow_getBranchSHA
      flowId: GetBranchSHA
      input:
        parameters:
          branch: alz-landingzones-infra
      output:
        binding:
          baseSha: =Topic.BaseSHA

    - kind: InvokeFlowAction
      id: invokeFlow_createBranch
      flowId: CreateGitHubBranch
      input:
        parameters:
          newBranch: =Topic.FeatureBranch
          baseSha: =Topic.BaseSHA
          targetRepo: alz-landingzones-infra

    - kind: InvokeFlowAction
      id: invokeFlow_generateAndCommitApp
      flowId: GenerateAndCommitAppFiles
      input:
        parameters:
          appName: =Topic.AppName
          environment: =Topic.Environment
          tier: =Topic.Tier
          resources: =Topic.Resources
          specialConfig: =Topic.SpecialConfig
          branch: =Topic.FeatureBranch
          targetRepo: alz-landingzones-infra

    - kind: SetVariable
      id: setVar_prTitle
      variable: Topic.PrTitle
      value: '=Concatenate("feat: add ", Topic.Environment, " ", Topic.AppName, " infrastructure (agent)")'

    - kind: SetVariable
      id: setVar_prBody
      variable: Topic.PrBody
      value: '=Concatenate("## Summary", Char(10), "- Application: ", Topic.AppName, Char(10), "- Environment: ", Topic.Environment, " (", Topic.Tier, ")", Char(10), "- Folder: ", Topic.Tier, "/", Topic.AppName, "/", Char(10), "- Resources: ", Topic.Resources, Char(10), Char(10), "## Checklist", Char(10), "- terraform validate", Char(10), "- tflint", Char(10), "- checkov -d .", Char(10), "- Cost estimate reviewed", Char(10), "- Tags validated FDD Table 12", Char(10), Char(10), "## Environment", Char(10), Topic.Environment, " | ", Topic.Tier)'

    - kind: InvokeFlowAction
      id: invokeFlow_createPR
      flowId: CreateGitHubPR
      input:
        parameters:
          featureBranch: =Topic.FeatureBranch
          baseBranch: alz-landingzones-infra
          targetRepo: alz-landingzones-infra
          prTitle: =Topic.PrTitle
          prBody: =Topic.PrBody
      output:
        binding:
          prUrl: =Topic.PullRequestUrl

    - kind: SendActivity
      id: sendMessage_prCreated
      activity:
        text:
          - |
            Application **{Topic.AppName}** scaffolded successfully!

            **Location:** {Topic.Tier}/{Topic.AppName}/
            **Branch:** {Topic.FeatureBranch}
            **Environment:** {Topic.Environment}

            **Files generated:**
            - main.tf, variables.tf, outputs.tf, locals.tf
            - versions.tf, backend.tf, provider.tf
            - terraform.tfvars.example, README.md, CHANGELOG.md

            **Pull Request:** {Topic.PullRequestUrl}

            Would you like me to generate tests for this application as well?
