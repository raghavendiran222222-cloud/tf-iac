mcs.metadata:
  componentName: Collect Modify
kind: AdaptiveDialog
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: CollectModify
    triggerQueries:
      - update existing
      - modify existing
      - add a variable
      - add a feature
      - add resource to existing
      - change an existing
      - update the module
      - update the app
      - extend an existing
      - I want to change
      - add new feature to
      - update terraform code
      - modify terraform file
  actions:
    - kind: SendActivity
      id: start001
      activity: I will help you update existing Terraform code. I will read the current files, apply your change, and open a PR with only the modified files.

    - kind: Question
      id: question_TargetName
      alwaysPrompt: false
      variable: init:Topic.TargetName
      prompt: Which app or module do you want to modify? (e.g. mvp-app, storage-module, infra-agent, keyvault-module)
      entity: StringPrebuiltEntity
      validations:
        - id: validation_TargetNotEmpty
          condition: =Length(Topic.TargetName) > 0
          invalidPrompt: Please specify the app or module name (e.g. mvp-app or storage-module).

    - kind: Question
      id: question_TargetType
      alwaysPrompt: false
      variable: init:Topic.TargetType
      prompt: Is this an app (on alz-landingzones-infra) or a module (on alz-modules)? Type app or module.
      entity: StringPrebuiltEntity
      validations:
        - id: validation_TargetTypeValue
          condition: =Or(Topic.TargetType = "app", Topic.TargetType = "module")
          invalidPrompt: Please type either app or module.

    - kind: Question
      id: question_ChangeDescription
      alwaysPrompt: false
      variable: init:Topic.ChangeDescription
      prompt: What change do you need? Describe it clearly. For example, add a boolean variable enable_private_endpoint with default false, or add lifecycle management policy support.
      entity: StringPrebuiltEntity

    # Resolve target branch and path from type
    - kind: ConditionGroup
      id: conditionGroup-resolveBranch
      conditions:
        - id: conditionGroup-resolveBranch-item-0
          condition: =Topic.TargetType = "module"
          actions:
            - kind: SetTextVariable
              id: setVar_branchModule
              variable: Global.TargetBranch
              value: alz-modules
            - kind: SetTextVariable
              id: setVar_pathModule
              variable: Global.TargetPath
              value: "{Topic.TargetName}"
        - id: conditionGroup-resolveBranch-item-1
          condition: =true
          actions:
            - kind: SetTextVariable
              id: setVar_branchApp
              variable: Global.TargetBranch
              value: alz-landingzones-infra
            - kind: SetTextVariable
              id: setVar_pathApp
              variable: Global.TargetPath
              value: "non-prod/{Topic.TargetName}"

    - kind: SetTextVariable
      id: setGlobal_targetName
      variable: Global.TargetName
      value: "{Topic.TargetName}"

    - kind: SetTextVariable
      id: setGlobal_targetType
      variable: Global.TargetType
      value: "{Topic.TargetType}"

    - kind: SetTextVariable
      id: setGlobal_changeDescription
      variable: Global.ChangeDescription
      value: "{Topic.ChangeDescription}"

    - kind: SendActivity
      id: sendMessage_reading
      activity: |
        ⚙️ Reading current files for **{Global.TargetName}** from `{Global.TargetBranch}` branch...

        I will apply your change and open a PR with only the modified files.

    - kind: BeginDialog
      id: redirectToModify
      dialog: modify-push
