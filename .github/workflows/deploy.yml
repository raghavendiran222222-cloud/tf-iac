name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch shared helpers
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: github-actions-workflows
          path: .shared
          sparse-checkout: helpers/

      - id: detect
        env:
          PATTERN: '^non-prod/'
          FIELD: "2"
          PREFIX: "non-prod"
        run: bash .shared/helpers/detect-changes.sh >> "$GITHUB_OUTPUT"

  nonprod:
    needs: detect
    if: needs.detect.outputs.changed != '[]'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        target: ${{ fromJson(needs.detect.outputs.changed) }}
    uses: btdmsd/github-actions-workflows/.github/workflows/apply.yaml@main
    with:
      working-directory: non-prod/${{ matrix.target }}
      environment: non-prod-${{ matrix.target }}
    secrets: inherit
