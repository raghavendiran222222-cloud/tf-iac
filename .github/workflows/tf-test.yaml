name: Terraform Test (reusable)

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Root directory of the module or application"
        required: true
        type: string
      repo-type:
        description: "module (root-level Terraform module) or app (non-prod workload)"
        required: false
        default: app
        type: string
      test-type:
        description: "plan | e2e | all"
        required: false
        default: plan
        type: string
# ── Plan-level tests ───────────────────────────────────────────────────────────
# Runs pytest (non-e2e) for modules, and pytest + terraform test for apps.
# No real Azure resources are deployed.
jobs:
  plan-tests:
    name: "plan-tests (${{ inputs.working-directory }})"
    if: inputs.test-type == 'plan' || inputs.test-type == 'all'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      ARM_USE_OIDC: "true"

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fetch secrets from HCP Vault Dedicated
        uses: hashicorp/vault-action@v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          namespace: admin
          method: jwt
          role: github-actions
          jwtGithubAudience: https://github.com/bdtmsd
          exportEnv: true
          secrets: |
            azure/data/github-actions     client_id        | ARM_CLIENT_ID ;
            azure/data/github-actions     tenant_id        | ARM_TENANT_ID ;
            azure/data/github-actions     subscription_id  | ARM_SUBSCRIPTION_ID ;

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"
          terraform_wrapper: false

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "${{ inputs.working-directory }}/tests/requirements.txt"

      - name: Install Python dependencies
        run: pip install -r "${{ inputs.working-directory }}/tests/requirements.txt"

      - name: Terraform Init — module (examples/basic)
        if: inputs.repo-type == 'module'
        working-directory: "${{ inputs.working-directory }}/examples/basic"
        run: terraform init -backend=false
        env:
          TF_CLI_ARGS_init: "-backend=false"

      - name: Terraform Init — app (working-directory root)
        if: inputs.repo-type == 'app'
        working-directory: "${{ inputs.working-directory }}"
        run: |
          printf 'terraform {\n  backend "local" {}\n}\n' > cloud_override.tf
          terraform init -reconfigure -input=false

      - name: Run plan-level pytest
        working-directory: "${{ inputs.working-directory }}/tests"
        env:
          TF_VAR_mysql_admin_password: ${{ secrets.TF_VAR_MYSQL_ADMIN_PASSWORD }}
        run: |
          mapfile -t files < <(ls test_*.py 2>/dev/null | grep -v e2e || true)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No plan-level pytest files found — skipping."
          else
            pytest -v --tb=short "${files[@]}"
          fi

      - name: Run terraform test (HCL) — app only
        if: inputs.repo-type == 'app'
        working-directory: "${{ inputs.working-directory }}"
        run: |
          if ls tests/*.tftest.hcl 2>/dev/null; then
            terraform test -test-directory=tests
          else
            echo "No .tftest.hcl files found — skipping."
          fi

# ── End-to-end tests ───────────────────────────────────────────────────────────
# Deploys real Azure infrastructure and destroys it.
  e2e-tests:
    name: "e2e-tests (${{ inputs.working-directory }})"
    if: inputs.test-type == 'e2e' || inputs.test-type == 'all'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      ARM_USE_OIDC: "true"

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fetch secrets from HCP Vault Dedicated
        uses: hashicorp/vault-action@v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          namespace: admin
          method: jwt
          role: github-actions
          jwtGithubAudience: https://github.com/bdtmsd
          exportEnv: true
          secrets: |
            azure/data/github-actions     client_id        | ARM_CLIENT_ID ;
            azure/data/github-actions     tenant_id        | ARM_TENANT_ID ;
            azure/data/github-actions     subscription_id  | ARM_SUBSCRIPTION_ID ;
            azure/data/github-actions     tfe_token        | TFE_TOKEN ;
            azure/data/github-actions     tf_organization  | TF_CLOUD_ORGANIZATION ;

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"
          terraform_wrapper: false
          cli_config_credentials_token: ${{ env.TFE_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "${{ inputs.working-directory }}/tests/requirements.txt"

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Set HCP Terraform workspace to local execution
        run: |
          workspace=$(basename "${{ inputs.working-directory }}")
          curl -sf -X PATCH \
            -H "Authorization: Bearer ${{ env.TFE_TOKEN }}" \
            -H "Content-Type: application/vnd.api+json" \
            --data '{"data":{"type":"workspaces","attributes":{"execution-mode":"local"}}}' \
            "https://app.terraform.io/api/v2/organizations/${{ env.TF_CLOUD_ORGANIZATION }}/workspaces/${workspace}"

      - name: Install Python dependencies
        run: pip install -r "${{ inputs.working-directory }}/tests/requirements.txt"

      - name: Run e2e tests
        working-directory: "${{ inputs.working-directory }}/tests"
        env:
          TF_VAR_mysql_admin_password: ${{ secrets.TF_VAR_MYSQL_ADMIN_PASSWORD }}
        run: |
          mapfile -t files < <(ls test_*e2e.py test_e2e*.py 2>/dev/null | sort -u || true)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No e2e test files found — skipping."
          else
            pytest -v -s "${files[@]}"
          fi
