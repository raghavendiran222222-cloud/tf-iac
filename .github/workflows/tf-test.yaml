name: Terraform Test (reusable)

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Root directory of the module or application"
        required: true
        type: string
      repo-type:
        description: "module (root-level Terraform module) or app (non-prod workload)"
        required: false
        default: app
        type: string
      test-type:
        description: "plan | e2e | all"
        required: false
        default: plan
        type: string
      environment:
        description: "GitHub environment for OIDC credentials"
        required: false
        default: non-prod-plan
        type: string

# ── Plan-level tests ───────────────────────────────────────────────────────────
# Runs pytest (non-e2e) for modules, and pytest + terraform test for apps.
# No real Azure resources are deployed.
jobs:
  plan-tests:
    name: "plan-tests (${{ inputs.working-directory }})"
    if: inputs.test-type == 'plan' || inputs.test-type == 'all'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"
          terraform_wrapper: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "${{ inputs.working-directory }}/tests/requirements.txt"

      - name: Install Python dependencies
        run: pip install -r "${{ inputs.working-directory }}/tests/requirements.txt"

      - name: Terraform Init — module (examples/basic)
        if: inputs.repo-type == 'module'
        working-directory: "${{ inputs.working-directory }}/examples/basic"
        run: terraform init -backend=false
        env:
          TF_CLI_ARGS_init: "-backend=false"

      - name: Terraform Init — app (working-directory root)
        if: inputs.repo-type == 'app'
        working-directory: "${{ inputs.working-directory }}"
        run: terraform init -backend=false
        env:
          TF_CLI_ARGS_init: "-backend=false"

      - name: Run plan-level pytest
        working-directory: "${{ inputs.working-directory }}/tests"
        env:
          TF_CLI_ARGS_init: "-backend=false"
        run: |
          mapfile -t files < <(ls test_*.py 2>/dev/null | grep -v e2e || true)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No plan-level pytest files found — skipping."
          else
            pytest -v --tb=short "${files[@]}"
          fi

      - name: Run terraform test (HCL) — app only
        if: inputs.repo-type == 'app'
        working-directory: "${{ inputs.working-directory }}"
        run: |
          if ls tests/*.tftest.hcl 2>/dev/null; then
            terraform test -test-directory=tests
          else
            echo "No .tftest.hcl files found — skipping."
          fi

# ── End-to-end tests ───────────────────────────────────────────────────────────
# Deploys real Azure infrastructure and destroys it. Module repos only.
  e2e-tests:
    name: "e2e-tests (${{ inputs.working-directory }})"
    if: |
      inputs.repo-type == 'module' &&
      (inputs.test-type == 'e2e' || inputs.test-type == 'all')
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"
          terraform_wrapper: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "${{ inputs.working-directory }}/tests/requirements.txt"

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Python dependencies
        run: pip install -r "${{ inputs.working-directory }}/tests/requirements.txt"

      - name: Run e2e tests
        working-directory: "${{ inputs.working-directory }}/tests"
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
        run: |
          mapfile -t files < <(ls test_*e2e*.py 2>/dev/null || true)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No e2e test files found — skipping."
          else
            pytest -v -s "${files[@]}"
          fi
