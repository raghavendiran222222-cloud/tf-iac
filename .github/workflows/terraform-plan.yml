name: Terraform Plan

on:
  pull_request:
    branches:
      - main
    paths:
      - "non-prod/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  contents: read
  pull-requests: write
  id-token: write  # Required for OIDC Azure login

jobs:
  plan:
    name: plan (${{ matrix.module }})
    runs-on: ubuntu-latest
    environment: non-prod-plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: non-prod/infra-agent
            workspace: infra-agent
            kv_secret_prefix: infra-agent
          - module: non-prod/mvp-app
            workspace: mvp-app
            kv_secret_prefix: mvp-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Fetch ARM secrets from Key Vault
        uses: azure/get-keyvault-secrets@v1
        with:
          keyvault: ${{ secrets.KEY_VAULT_NAME }}
          secrets: "arm-client-id, arm-client-secret, arm-subscription-id, arm-tenant-id, tfe-token"
        id: kv

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"
          cli_config_credentials_token: ${{ steps.kv.outputs.tfe-token }}

      - name: Terraform Init
        working-directory: ${{ matrix.module }}
        env:
          ARM_CLIENT_ID: ${{ steps.kv.outputs.arm-client-id }}
          ARM_CLIENT_SECRET: ${{ steps.kv.outputs.arm-client-secret }}
          ARM_SUBSCRIPTION_ID: ${{ steps.kv.outputs.arm-subscription-id }}
          ARM_TENANT_ID: ${{ steps.kv.outputs.arm-tenant-id }}
          TF_CLOUD_ORGANIZATION: ${{ secrets.TF_CLOUD_ORGANIZATION }}
        run: terraform init

      - name: Terraform Plan
        id: plan
        working-directory: ${{ matrix.module }}
        env:
          ARM_CLIENT_ID: ${{ steps.kv.outputs.arm-client-id }}
          ARM_CLIENT_SECRET: ${{ steps.kv.outputs.arm-client-secret }}
          ARM_SUBSCRIPTION_ID: ${{ steps.kv.outputs.arm-subscription-id }}
          ARM_TENANT_ID: ${{ steps.kv.outputs.arm-tenant-id }}
        run: |
          terraform plan -no-color -out=tfplan 2>&1 | tee plan_output.txt
          echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.workspace }}
          path: ${{ matrix.module }}/tfplan
          retention-days: 7

      - name: Comment plan on PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync('${{ matrix.module }}/plan_output.txt', 'utf8');
            const truncated = planOutput.length > 65000
              ? planOutput.substring(0, 65000) + '\n... (truncated)'
              : planOutput;
            const body = `## Terraform Plan — \`${{ matrix.module }}\`\n\`\`\`hcl\n${truncated}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
