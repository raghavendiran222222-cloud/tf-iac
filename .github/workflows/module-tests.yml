name: Module Tests

on:
  push:
    branches: ["**"]
    paths:
      - "**-module/**"
  pull_request:
    branches: ["**"]
    paths:
      - "**-module/**"
  workflow_dispatch:
    inputs:
      test_type:
        description: "Test type"
        required: false
        default: plan
        type: choice
        options:
          - plan
          - e2e
          - all

# ─────────────────────────────────────────────────────────────────────────────
# DISCOVERY
# Finds every *-module/ directory that contains a tests/ folder with .py files.
# Outputs a JSON array consumed by the matrix strategy in downstream jobs.
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  discover:
    name: Discover modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.scan.outputs.modules }}

    steps:
      - uses: actions/checkout@v4

      - name: Scan for testable modules
        id: scan
        shell: bash
        run: |
          set -euo pipefail

          # Find every *-module dir that has at least one test_*.py file under tests/
          mapfile -t found < <(
            find . -maxdepth 2 -type d -name "tests" \
              | grep -E '\.\/[^/]+-module/tests$' \
              | while read -r testdir; do
                  if ls "$testdir"/test_*.py &>/dev/null 2>&1; then
                    echo "${testdir%/tests}" | sed 's|^\./||'
                  fi
                done \
              | sort -u
          )

          if [[ ${#found[@]} -eq 0 ]]; then
            echo "modules=[]" >> "$GITHUB_OUTPUT"
          else
            json=$(printf '%s\n' "${found[@]}" | jq -R . | jq -sc .)
            echo "modules=$json" >> "$GITHUB_OUTPUT"
          fi

          echo "Discovered modules: ${found[*]:-none}"

# ─────────────────────────────────────────────────────────────────────────────
# PLAN TESTS  (no Azure resources deployed — terraform plan only)
# Runs on every push/PR.  Skips files whose names contain "e2e".
# ─────────────────────────────────────────────────────────────────────────────
  plan-tests:
    name: "Plan · ${{ matrix.module }}"
    needs: discover
    if: >-
      needs.discover.outputs.modules != '[]' &&
      (
        github.event_name != 'workflow_dispatch' ||
        github.event.inputs.test_type == 'plan' ||
        github.event.inputs.test_type == 'all'
      )
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for OIDC token exchange
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover.outputs.modules) }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ">= 1.14.0"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "${{ matrix.module }}/tests/requirements.txt"

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Python dependencies
        run: pip install -r "${{ matrix.module }}/tests/requirements.txt"

      - name: Terraform Init
        run: terraform init -backend=false
        working-directory: "${{ matrix.module }}/examples/basic"
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan
        working-directory: "${{ matrix.module }}/examples/basic"
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"

      - name: Run plan-level pytest tests
        working-directory: "${{ matrix.module }}/tests"
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
          TF_CLI_ARGS_init: "-backend=false"
        run: |
          mapfile -t plan_files < <(ls test_*.py 2>/dev/null | grep -v 'e2e')

          if [[ ${#plan_files[@]} -eq 0 ]]; then
            echo "No plan-level test files found — skipping."
            exit 0
          fi

          pytest -v "${plan_files[@]}"

# ─────────────────────────────────────────────────────────────────────────────
# E2E TESTS  (deploys real Azure infrastructure, then destroys it)
# Runs only on: push to main  OR  workflow_dispatch with test_type=e2e|all.
# max-parallel: 1 prevents concurrent applies against the same subscription.
# ─────────────────────────────────────────────────────────────────────────────
  e2e-tests:
    name: "E2E · ${{ matrix.module }}"
    needs: discover
    if: >-
      needs.discover.outputs.modules != '[]' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' &&
         (github.event.inputs.test_type == 'e2e' || github.event.inputs.test_type == 'all'))
      )
    runs-on: ubuntu-latest
    environment: azure-e2e        # manual approval gate in GitHub repo settings
    permissions:
      id-token: write   # required for OIDC token exchange
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1             # avoid concurrent infra applies
      matrix:
        module: ${{ fromJson(needs.discover.outputs.modules) }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ">= 1.14.0"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "${{ matrix.module }}/tests/requirements.txt"

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Python dependencies
        run: pip install -r "${{ matrix.module }}/tests/requirements.txt"

      - name: Run e2e tests
        working-directory: "${{ matrix.module }}/tests"
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
        run: |
          mapfile -t e2e_files < <(ls test_*e2e*.py 2>/dev/null)

          if [[ ${#e2e_files[@]} -eq 0 ]]; then
            echo "No e2e test files found — skipping."
            exit 0
          fi

          pytest -v -s "${e2e_files[@]}"
