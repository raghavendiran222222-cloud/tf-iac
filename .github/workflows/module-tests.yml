name: Module Tests (reusable)

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Root directory of the module (e.g. storage-module)"
        required: true
        type: string
      test_type:
        description: "plan | e2e | all"
        required: false
        default: plan
        type: string
      environment:
        description: "GitHub environment for OIDC credentials"
        required: false
        default: non-prod-plan
        type: string

jobs:
  plan-tests:
    name: "plan · ${{ inputs.working-directory }}"
    if: inputs.test_type == 'plan' || inputs.test_type == 'all'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"
          terraform_wrapper: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "${{ inputs.working-directory }}/tests/requirements.txt"

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Python dependencies
        run: pip install -r "${{ inputs.working-directory }}/tests/requirements.txt"

      - name: Terraform Init (no backend)
        working-directory: "${{ inputs.working-directory }}/examples/basic"
        run: terraform init -backend=false
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"

      - name: Run plan-level pytest tests
        working-directory: "${{ inputs.working-directory }}/tests"
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
          TF_CLI_ARGS_init: "-backend=false"
        run: |
          mapfile -t plan_files < <(ls test_*.py 2>/dev/null | grep -v e2e || true)
          if [[ ${#plan_files[@]} -eq 0 ]]; then
            echo "No plan-level test files found — skipping."
            exit 0
          fi
          pytest -v --tb=short "${plan_files[@]}"

  e2e-tests:
    name: "e2e · ${{ inputs.working-directory }}"
    if: inputs.test_type == 'e2e' || inputs.test_type == 'all'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"
          terraform_wrapper: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "${{ inputs.working-directory }}/tests/requirements.txt"

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Python dependencies
        run: pip install -r "${{ inputs.working-directory }}/tests/requirements.txt"

      - name: Run e2e tests
        working-directory: "${{ inputs.working-directory }}/tests"
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
        run: |
          mapfile -t e2e_files < <(ls test_*e2e*.py 2>/dev/null || true)
          if [[ ${#e2e_files[@]} -eq 0 ]]; then
            echo "No e2e test files found — skipping."
            exit 0
          fi
          pytest -v -s "${e2e_files[@]}"
