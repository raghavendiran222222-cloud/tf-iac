name: mvp-app

on:
  pull_request:
    branches: [main]
    paths:
      - "non-prod/mvp-app/**"
  push:
    branches: [main]
    paths:
      - "non-prod/mvp-app/**"
  workflow_dispatch:
    inputs:
      action:
        description: "Action to run"
        required: true
        type: choice
        options: [destroy]

concurrency:
  group: mvp-app-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── PR: fail fast on syntax/format ────────────────────────────────────────
  fmt-validate:
    if: github.event_name == 'pull_request'
    uses: btdmsd/github-actions-workflows/.github/workflows/fmt-validate.yaml@main
    with:
      working-directory: non-prod/mvp-app
    secrets: inherit

  # ── PR: plan (needs fmt-validate to pass first) ───────────────────────────
  plan:
    if: github.event_name == 'pull_request'
    needs: [fmt-validate]
    uses: btdmsd/github-actions-workflows/.github/workflows/plan.yaml@main
    with:
      working-directory: non-prod/mvp-app
      environment: non-prod-plan
    secrets: inherit

  # ── PR: security gate on plan JSON ────────────────────────────────────────
  checkov:
    if: github.event_name == 'pull_request'
    needs: [plan]
    uses: btdmsd/github-actions-workflows/.github/workflows/checkov.yaml@main
    with:
      working-directory: non-prod/mvp-app
    secrets: inherit

  # ── PR: optional unit/plan-level tests (parallel with plan) ───────────────
  tf-test:
    if: github.event_name == 'pull_request'
    needs: [fmt-validate]
    uses: btdmsd/github-actions-workflows/.github/workflows/tf-test.yaml@main
    with:
      working-directory: non-prod/mvp-app
      repo-type: app
      test-type: plan
    secrets: inherit

  # ── Post-merge: re-plan to catch drift ────────────────────────────────────
  plan-post-merge:
    if: github.event_name == 'push'
    uses: btdmsd/github-actions-workflows/.github/workflows/plan.yaml@main
    with:
      working-directory: non-prod/mvp-app
      environment: non-prod-plan
    secrets: inherit

  # ── Post-merge: apply with manual approval gate ───────────────────────────
  deploy:
    if: github.event_name == 'push'
    needs: [plan-post-merge]
    uses: btdmsd/github-actions-workflows/.github/workflows/apply.yaml@main
    with:
      working-directory: non-prod/mvp-app
      environment: non-prod-mvp-app
    secrets: inherit

  # ── Post-merge: e2e tests against deployed infra ─────────────────────────
  pytest-e2e:
    if: github.event_name == 'push'
    needs: [deploy]
    uses: btdmsd/github-actions-workflows/.github/workflows/tf-test.yaml@main
    with:
      working-directory: non-prod/mvp-app
      repo-type: app
      test-type: e2e
      environment: non-prod-mvp-app
    secrets: inherit

  # ── Manual: destroy with approval gate (workflow_dispatch only) ───────────
  destroy:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
    runs-on: ubuntu-latest
    environment: non-prod-mvp-app-destroy
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: non-prod/mvp-app

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"
          terraform_wrapper: false
          cli_config_credentials_token: ${{ secrets.TFE_TOKEN }}

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: terraform init -input=false
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
          TF_CLOUD_ORGANIZATION: ${{ secrets.TF_CLOUD_ORGANIZATION }}

      - name: Terraform Destroy
        run: terraform destroy -input=false -auto-approve
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
