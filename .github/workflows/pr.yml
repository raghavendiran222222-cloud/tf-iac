name: PR Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "non-prod/**"

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: pr-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch shared helpers
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: github-actions-workflows
          path: .shared
          sparse-checkout: helpers/

      - id: detect
        env:
          PATTERN: '^non-prod/'
          FIELD: "2"
          PREFIX: "non-prod"
        run: bash .shared/helpers/detect-changes.sh >> "$GITHUB_OUTPUT"

  validate:
    needs: detect
    if: needs.detect.outputs.changed != '[]'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.detect.outputs.changed) }}
    uses: btdmsd/github-actions-workflows/.github/workflows/fmt-validate.yaml@main
    with:
      working-directory: non-prod/${{ matrix.target }}
    secrets: inherit

  plan:
    needs: detect
    if: needs.detect.outputs.changed != '[]'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.detect.outputs.changed) }}
    uses: btdmsd/github-actions-workflows/.github/workflows/plan.yaml@main
    with:
      working-directory: non-prod/${{ matrix.target }}
      environment: non-prod-plan
    secrets: inherit

  checkov:
    needs: plan
    if: needs.detect.outputs.changed != '[]'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.detect.outputs.changed) }}
    uses: btdmsd/github-actions-workflows/.github/workflows/checkov.yaml@main
    with:
      working-directory: non-prod/${{ matrix.target }}
    secrets: inherit
