name: Terraform Apply

on:
  push:
    branches:
      - main
    paths:
      - "non-prod/**"
      - ".github/workflows/terraform-apply.yml"

permissions:
  contents: read
  id-token: write  # Required for OIDC Azure login

jobs:
  apply:
    name: apply (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: non-prod/infra-agent
            workspace: infra-agent
            environment: non-prod-infra-agent
          - module: non-prod/mvp-app
            workspace: mvp-app
            environment: non-prod-mvp-app

    environment:
      name: ${{ matrix.environment }}  # Requires manual approval gate in GitHub Environments

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Fetch ARM secrets from Key Vault
        uses: azure/get-keyvault-secrets@v1
        with:
          keyvault: ${{ secrets.KEY_VAULT_NAME }}
          secrets: "arm-client-id, arm-client-secret, arm-subscription-id, arm-tenant-id, tfe-token"
        id: kv

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"
          cli_config_credentials_token: ${{ steps.kv.outputs.tfe-token }}

      - name: Terraform Init
        working-directory: ${{ matrix.module }}
        env:
          ARM_CLIENT_ID: ${{ steps.kv.outputs.arm-client-id }}
          ARM_CLIENT_SECRET: ${{ steps.kv.outputs.arm-client-secret }}
          ARM_SUBSCRIPTION_ID: ${{ steps.kv.outputs.arm-subscription-id }}
          ARM_TENANT_ID: ${{ steps.kv.outputs.arm-tenant-id }}
          TF_CLOUD_ORGANIZATION: ${{ secrets.TF_CLOUD_ORGANIZATION }}
        run: terraform init

      - name: Terraform Apply
        working-directory: ${{ matrix.module }}
        env:
          ARM_CLIENT_ID: ${{ steps.kv.outputs.arm-client-id }}
          ARM_CLIENT_SECRET: ${{ steps.kv.outputs.arm-client-secret }}
          ARM_SUBSCRIPTION_ID: ${{ steps.kv.outputs.arm-subscription-id }}
          ARM_TENANT_ID: ${{ steps.kv.outputs.arm-tenant-id }}
        run: terraform apply -auto-approve -no-color
