name: Terraform Plan (reusable)

on:
  workflow_call:
    inputs:
      working-directory:
        required: true
        type: string
      environment:
        required: true
        type: string

jobs:
  plan:
    name: plan (${{ inputs.working-directory }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"
          terraform_wrapper: false
          cli_config_credentials_token: ${{ secrets.TFE_TOKEN }}

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: terraform init -input=false
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
          TF_CLOUD_ORGANIZATION: ${{ secrets.TF_CLOUD_ORGANIZATION }}

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -input=false -no-color -out=tfplan 2>&1 | tee plan_output.txt
          echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"

      - name: Export plan JSON
        run: terraform show -json tfplan > tfplan.json
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.event.number }}-${{ inputs.working-directory }}
          path: |
            ${{ inputs.working-directory }}/tfplan
            ${{ inputs.working-directory }}/tfplan.json
          retention-days: 7

      - name: Post plan comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('${{ inputs.working-directory }}/plan_output.txt', 'utf8');

            const noChanges = raw.includes('No changes. Your infrastructure matches the configuration.');
            const summaryMatch = raw.match(/Plan: (\d+) to add, (\d+) to change, (\d+) to destroy\./);

            let summary;
            if (noChanges) {
              summary = '**No changes** — infrastructure matches configuration.';
            } else if (summaryMatch) {
              const [, add, change, destroy] = summaryMatch;
              const parts = [];
              if (parseInt(add) > 0)     parts.push(`**+${add} to add**`);
              if (parseInt(change) > 0)  parts.push(`**~${change} to change**`);
              if (parseInt(destroy) > 0) parts.push(`**-${destroy} to destroy**`);
              summary = parts.join(' · ') || 'No resource changes.';
            } else {
              summary = '_Could not parse plan summary — check workflow logs._';
            }

            const truncated = raw.length > 60000
              ? raw.substring(0, 60000) + '\n\n... (truncated — see workflow logs)'
              : raw;

            const workload = '${{ inputs.working-directory }}';
            const marker = `Terraform Plan — \`${workload}\``;
            const body = [
              `## ${marker}`, '', summary, '',
              '<details><summary>Full plan output</summary>', '',
              '```hcl', truncated, '```', '', '</details>', '',
              `> Run: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            for (const c of comments) {
              if (c.user.login === 'github-actions[bot]' && c.body.includes(marker)) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  comment_id: c.id,
                });
              }
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner, repo: context.repo.repo,
              body,
            });
