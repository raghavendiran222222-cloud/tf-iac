name: Terraform Plan (reusable)

on:
  workflow_call:
    inputs:
      working-directory:
        required: true
        type: string

jobs:
  plan:
    name: plan (${{ inputs.working-directory }})
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      ARM_USE_OIDC: "true"

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Debug JWT sub claim
      run: |
        TOKEN=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://github.com/bdtmsd" \
          | jq -r '.value')
        echo $TOKEN | cut -d. -f2 | base64 -d 2>/dev/null | jq .

    - name: Fetch secrets from HCP Vault Dedicated
      uses: hashicorp/vault-action@v4.0.0
      with:
        url: ${{ secrets.VAULT_ADDR }}
        namespace: admin
        method: jwt
        role: github-actions
        jwtGithubAudience: https://github.com/bdtmsd
        exportEnv: true
        secrets: |
          azure/data/github-actions     client_id            | ARM_CLIENT_ID ;
          azure/data/github-actions     tenant_id            | ARM_TENANT_ID ;
          azure/data/github-actions     subscription_id      | ARM_SUBSCRIPTION_ID ;
          azure/data/github-actions     tfe_token            | TFE_TOKEN ;
          azure/data/github-actions     tf_organization | TF_CLOUD_ORGANIZATION ;

    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "~> 1.9"
        terraform_wrapper: false
        cli_config_credentials_token: ${{ env.TFE_TOKEN }}

    - name: Azure Login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ env.ARM_CLIENT_ID }}
        tenant-id: ${{ env.ARM_TENANT_ID }}
        subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

    - name: Set HCP Terraform workspace to local execution
      run: |
        workspace=$(basename "${{ inputs.working-directory }}")
        curl -sf -X PATCH \
          -H "Authorization: Bearer ${{ env.TFE_TOKEN }}" \
          -H "Content-Type: application/vnd.api+json" \
          --data '{"data":{"type":"workspaces","attributes":{"execution-mode":"local"}}}' \
          "https://app.terraform.io/api/v2/organizations/${{ env.TF_CLOUD_ORGANIZATION }}/workspaces/${workspace}"

    - name: Terraform Init
      run: terraform init -input=false

    - name: Terraform Plan
      id: plan
      run: |
        terraform plan -input=false -no-color -out=tfplan 2>&1 | tee plan_output.txt
        echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

    - name: Export plan JSON
      run: terraform show -json tfplan > tfplan.json

    - name: Sanitize artifact name
      id: artifact-name
      run: |
        safe=$(echo "${{ inputs.working-directory }}" | tr '/' '-')
        echo "name=tfplan-${{ github.run_id }}-${safe}" >> "$GITHUB_OUTPUT"

    - name: Upload plan artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.artifact-name.outputs.name }}
        path: |
          ${{ inputs.working-directory }}/tfplan
          ${{ inputs.working-directory }}/tfplan.json
        retention-days: 7

    - name: Post plan comment
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const raw = fs.readFileSync('${{ inputs.working-directory }}/plan_output.txt', 'utf8');

          const noChanges = raw.includes('No changes. Your infrastructure matches the configuration.');
          const summaryMatch = raw.match(/Plan: (\d+) to add, (\d+) to change, (\d+) to destroy\./);

          let summary;
          if (noChanges) {
            summary = '**No changes** — infrastructure matches configuration.';
          } else if (summaryMatch) {
            const [, add, change, destroy] = summaryMatch;
            const parts = [];
            if (parseInt(add) > 0)     parts.push(`**+${add} to add**`);
            if (parseInt(change) > 0)  parts.push(`**~${change} to change**`);
            if (parseInt(destroy) > 0) parts.push(`**-${destroy} to destroy**`);
            summary = parts.join(' · ') || 'No resource changes.';
          } else {
            summary = '_Could not parse plan summary — check workflow logs._';
          }

          const truncated = raw.length > 60000
            ? raw.substring(0, 60000) + '\n\n... (truncated — see workflow logs)'
            : raw;

          const workload = '${{ inputs.working-directory }}';
          const marker = `Terraform Plan — \`${workload}\``;
          const body = [
            `## ${marker}`, '', summary, '',
            '<details><summary>Full plan output</summary>', '',
            '```hcl', truncated, '```', '', '</details>', '',
            `> Run: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`
          ].join('\n');

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner, repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          for (const c of comments) {
            if (c.user.login === 'github-actions[bot]' && c.body.includes(marker)) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: c.id,
              });
            }
          }
          await github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner, repo: context.repo.repo,
            body,
          });
