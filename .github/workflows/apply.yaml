name: Terraform Apply (reusable)

on:
  workflow_call:
    inputs:
      working-directory:
        required: true
        type: string
      environment:
        required: true
        type: string

jobs:
  apply:
    name: apply (${{ inputs.working-directory }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      ARM_USE_OIDC: "true"

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Fetch secrets from HCP Vault Dedicated
      uses: hashicorp/vault-action@v3
      with:
        url: ${{ secrets.VAULT_ADDR }}
        method: jwt
        role: ${{ secrets.VAULT_ROLE }}
        exportEnv: true
        secrets: |
          kv/data/azure client_id        | AZURE_CLIENT_ID ;
          kv/data/azure tenant_id        | AZURE_TENANT_ID ;
          kv/data/azure subscription_id  | AZURE_SUBSCRIPTION_ID ;
          kv/data/terraform organization | TF_CLOUD_ORGANIZATION ;
          kv/data/terraform tfe_token    | TFE_TOKEN ;

    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "~> 1.9"
        terraform_wrapper: false
        cli_config_credentials_token: ${{ env.TFE_TOKEN }}

    - name: Azure Login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ env.AZURE_CLIENT_ID }}
        tenant-id: ${{ env.AZURE_TENANT_ID }}
        subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

    - name: Terraform Init
      run: terraform init -input=false

    - name: Terraform Plan
      run: terraform plan -input=false -out=tfplan

    - name: Terraform Apply
      run: terraform apply -input=false -auto-approve tfplan
