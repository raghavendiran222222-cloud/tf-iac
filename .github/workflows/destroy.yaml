name: Terraform Destroy (reusable)

on:
  workflow_call:
    inputs:
      working-directory:
        required: true
        type: string

jobs:
  destroy:
    name: destroy (${{ inputs.working-directory }})
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      ARM_USE_OIDC: "true"

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Fetch secrets from HCP Vault Dedicated
      uses: hashicorp/vault-action@v4.0.0
      with:
        url: ${{ secrets.VAULT_ADDR }}
        namespace: admin
        method: jwt
        role: github-actions
        jwtGithubAudience: https://github.com/bdtmsd
        exportEnv: true
        secrets: |
          azure/data/github-actions     client_id            | ARM_CLIENT_ID ;
          azure/data/github-actions     tenant_id            | ARM_TENANT_ID ;
          azure/data/github-actions     subscription_id      | ARM_SUBSCRIPTION_ID ;
          azure/data/github-actions     tfe_token            | TFE_TOKEN ;
          azure/data/github-actions     tf_organization      | TF_CLOUD_ORGANIZATION ;

    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "~> 1.9"
        terraform_wrapper: false
        cli_config_credentials_token: ${{ env.TFE_TOKEN }}

    - name: Azure Login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ env.ARM_CLIENT_ID }}
        tenant-id: ${{ env.ARM_TENANT_ID }}
        subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

    - name: Set HCP Terraform workspace to local execution
      run: |
        workspace=$(basename "${{ inputs.working-directory }}")
        curl -sf -X PATCH \
          -H "Authorization: Bearer ${{ env.TFE_TOKEN }}" \
          -H "Content-Type: application/vnd.api+json" \
          --data '{"data":{"type":"workspaces","attributes":{"execution-mode":"local"}}}' \
          "https://app.terraform.io/api/v2/organizations/${{ env.TF_CLOUD_ORGANIZATION }}/workspaces/${workspace}"

    - name: Terraform Init
      run: terraform init -input=false

    - name: Terraform Destroy
      run: terraform destroy -input=false -auto-approve
